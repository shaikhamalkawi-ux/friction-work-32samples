name: Public one-command check — H2 Lubricants
on:
  push:
    paths:
      - 'public_quickcheck.py'
      - '.github/workflows/public-quickcheck.yml'
  pull_request:
  workflow_dispatch:
jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python public_quickcheck.py
