name: Reproducibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  derived-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verify_release.py
      - run: python tests/test_guards.py
      - run: python reproduce.py --mode derived --out ../derived-check
